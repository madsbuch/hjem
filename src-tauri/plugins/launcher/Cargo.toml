[package]
name = "tauri-plugin-launcher"
version = "0.1.0"
edition = "2021"
description = "Android home screen and installed-app launcher for Hjem"
publish = false
links = "tauri-plugin-launcher"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
