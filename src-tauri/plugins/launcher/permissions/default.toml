"$schema" = "schemas/schema.json"

[default]
description = "List launchable Android apps, open a chosen app or its system App info/uninstall confirmation, and open the home-app chooser."
permissions = ["allow-get-status", "allow-list-apps", "allow-launch-app", "allow-uninstall-app", "allow-open-app-info", "allow-open-home-settings", "allow-register-listener", "allow-remove-listener"]
