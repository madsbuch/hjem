"$schema" = "schemas/schema.json"

[default]
description = "List launchable Android apps, open a chosen app or its system App info/uninstall confirmation, open the home-app chooser, and save or open a file the person picks."
permissions = ["allow-get-status", "allow-list-apps", "allow-launch-app", "allow-uninstall-app", "allow-open-app-info", "allow-open-home-settings", "allow-save-document", "allow-open-document", "allow-register-listener", "allow-remove-listener"]
