[package]
name = "hjem"
version = "0.1.0"
description = "Hjem — a calm home for Home Assistant"
edition = "2021"
rust-version = "1.90"

[lib]
name = "hjem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-launcher = { path = "plugins/launcher" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
diesel = { version = "2.4", default-features = false, features = ["sqlite"] }
diesel_migrations = { version = "2.4", features = ["sqlite"] }
libsqlite3-sys = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.5.3"
