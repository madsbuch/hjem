[package]
name = "hjem"
version = "0.1.0"
description = "Hjem — a calm home for Home Assistant"
edition = "2021"
rust-version = "1.80"

[lib]
name = "hjem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
